name: local-doc-search

services:
  backend:
    build:
      context: ./backend
    image: local-doc-search-backend
    container_name: local-doc-search-backend
    restart: unless-stopped
    environment:
      APP_ROLE: api
      DOCUMENT_ROOT: /library
      STATE_DIR: /data
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-WAL}
      OCR_ENGINE: ${OCR_ENGINE:-api}
      OCR_VERSION: ${OCR_VERSION:-PP-OCRv6}
      OCR_DEVICE: ${OCR_DEVICE:-api}
      PADDLEOCR_API_URL: ${PADDLEOCR_API_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      PADDLEOCR_API_TOKEN: ${PADDLEOCR_API_TOKEN:-}
      PADDLEOCR_API_MODEL: ${PADDLEOCR_API_MODEL:-PP-OCRv6}
      PADDLEOCR_DAILY_PAGE_LIMIT: ${PADDLEOCR_DAILY_PAGE_LIMIT:-20000}
      PADDLEOCR_QUOTA_TIMEZONE: ${PADDLEOCR_QUOTA_TIMEZONE:-Asia/Shanghai}
      PADDLEOCR_API_BATCH_PAGES: ${PADDLEOCR_API_BATCH_PAGES:-100}
      PADDLEOCR_API_TRANSPORT_RETRIES: ${PADDLEOCR_API_TRANSPORT_RETRIES:-4}
      PADDLEOCR_API_POLL_SECONDS: ${PADDLEOCR_API_POLL_SECONDS:-5}
      PADDLEOCR_API_TIMEOUT_SECONDS: ${PADDLEOCR_API_TIMEOUT_SECONDS:-7200}
      PADDLEOCR_API_REQUEST_TIMEOUT_SECONDS: ${PADDLEOCR_API_REQUEST_TIMEOUT_SECONDS:-300}
      PADDLEOCR_USE_DOC_ORIENTATION_CLASSIFY: ${PADDLEOCR_USE_DOC_ORIENTATION_CLASSIFY:-false}
      PADDLEOCR_USE_DOC_UNWARPING: ${PADDLEOCR_USE_DOC_UNWARPING:-false}
      PADDLEOCR_USE_TEXTLINE_ORIENTATION: ${PADDLEOCR_USE_TEXTLINE_ORIENTATION:-false}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-80}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-0}
      MAX_FILE_MB: ${MAX_FILE_MB:-0}
      MAX_OUTPUT_PDF_MB: ${MAX_OUTPUT_PDF_MB:-0}
      RESOURCE_AUTO_TUNE: ${RESOURCE_AUTO_TUNE:-true}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-20}
      EXCLUDE_DIRS: ${EXCLUDE_DIRS:-.docsearch,.git,.svn,node_modules,__pycache__,.pytest_cache,.venv,venv}
      EXCLUDE_PATHS: ${EXCLUDE_PATHS:-}
      PDF_TEXT_ONLY_PATHS: ${PDF_TEXT_ONLY_PATHS:-pdf/论文}
      CAJ_CONVERTER_COMMAND: ${CAJ_CONVERTER_COMMAND:-caj2pdf convert {input} -o {output}}
      CAJ_CONVERTER_TIMEOUT_SECONDS: ${CAJ_CONVERTER_TIMEOUT_SECONDS:-600}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      DEEPSEEK_MAX_CHARS: ${DEEPSEEK_MAX_CHARS:-60000}
      PUBLICATION_EXTRACT_ENABLED: ${PUBLICATION_EXTRACT_ENABLED:-true}
      LOCAL_OPEN_ENABLED: ${LOCAL_OPEN_ENABLED:-true}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_TIMEOUT_SECONDS: ${SILICONFLOW_TIMEOUT_SECONDS:-60}
      SILICONFLOW_RETRIES: ${SILICONFLOW_RETRIES:-3}
      SILICONFLOW_EMBEDDING_BATCH_SIZE: ${SILICONFLOW_EMBEDDING_BATCH_SIZE:-0}
      SILICONFLOW_EMBEDDING_CONCURRENCY: ${SILICONFLOW_EMBEDDING_CONCURRENCY:-120}
      SILICONFLOW_REQUESTS_PER_SECOND: ${SILICONFLOW_REQUESTS_PER_SECOND:-30}
      SILICONFLOW_TOKENS_PER_MINUTE: ${SILICONFLOW_TOKENS_PER_MINUTE:-1000000}
      SILICONFLOW_MAX_REQUEST_TOKENS: ${SILICONFLOW_MAX_REQUEST_TOKENS:-30000}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-512}
      VECTOR_INDEX_ENABLED: ${VECTOR_INDEX_ENABLED:-true}
      VECTOR_SEARCH_CANDIDATES: ${VECTOR_SEARCH_CANDIDATES:-5000}
      VECTOR_JOB_CONCURRENCY: ${VECTOR_JOB_CONCURRENCY:-12}
    volumes:
      - type: bind
        source: ./data
        target: /library
      - type: bind
        source: ./.docsearch
        target: /data
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    image: local-doc-search-backend
    container_name: local-doc-search-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DOCUMENT_ROOT: /library
      STATE_DIR: /data
      SQLITE_JOURNAL_MODE: ${SQLITE_JOURNAL_MODE:-WAL}
      OCR_ENGINE: ${OCR_ENGINE:-api}
      OCR_VERSION: ${OCR_VERSION:-PP-OCRv6}
      OCR_DEVICE: ${OCR_DEVICE:-api}
      PADDLEOCR_API_URL: ${PADDLEOCR_API_URL:-https://paddleocr.aistudio-app.com/api/v2/ocr/jobs}
      PADDLEOCR_API_TOKEN: ${PADDLEOCR_API_TOKEN:-}
      PADDLEOCR_API_MODEL: ${PADDLEOCR_API_MODEL:-PP-OCRv6}
      PADDLEOCR_DAILY_PAGE_LIMIT: ${PADDLEOCR_DAILY_PAGE_LIMIT:-20000}
      PADDLEOCR_QUOTA_TIMEZONE: ${PADDLEOCR_QUOTA_TIMEZONE:-Asia/Shanghai}
      PADDLEOCR_API_BATCH_PAGES: ${PADDLEOCR_API_BATCH_PAGES:-100}
      PADDLEOCR_API_TRANSPORT_RETRIES: ${PADDLEOCR_API_TRANSPORT_RETRIES:-4}
      PADDLEOCR_API_POLL_SECONDS: ${PADDLEOCR_API_POLL_SECONDS:-5}
      PADDLEOCR_API_TIMEOUT_SECONDS: ${PADDLEOCR_API_TIMEOUT_SECONDS:-7200}
      PADDLEOCR_API_REQUEST_TIMEOUT_SECONDS: ${PADDLEOCR_API_REQUEST_TIMEOUT_SECONDS:-300}
      PADDLEOCR_USE_DOC_ORIENTATION_CLASSIFY: ${PADDLEOCR_USE_DOC_ORIENTATION_CLASSIFY:-false}
      PADDLEOCR_USE_DOC_UNWARPING: ${PADDLEOCR_USE_DOC_UNWARPING:-false}
      PADDLEOCR_USE_TEXTLINE_ORIENTATION: ${PADDLEOCR_USE_TEXTLINE_ORIENTATION:-false}
      OCR_MIN_TEXT_CHARS: ${OCR_MIN_TEXT_CHARS:-80}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-0}
      MAX_FILE_MB: ${MAX_FILE_MB:-0}
      MAX_OUTPUT_PDF_MB: ${MAX_OUTPUT_PDF_MB:-0}
      RESOURCE_AUTO_TUNE: ${RESOURCE_AUTO_TUNE:-true}
      EXCLUDE_DIRS: ${EXCLUDE_DIRS:-.docsearch,.git,.svn,node_modules,__pycache__,.pytest_cache,.venv,venv}
      EXCLUDE_PATHS: ${EXCLUDE_PATHS:-}
      PDF_TEXT_ONLY_PATHS: ${PDF_TEXT_ONLY_PATHS:-pdf/论文}
      CAJ_CONVERTER_COMMAND: ${CAJ_CONVERTER_COMMAND:-caj2pdf convert {input} -o {output}}
      CAJ_CONVERTER_TIMEOUT_SECONDS: ${CAJ_CONVERTER_TIMEOUT_SECONDS:-600}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-120}
      DEEPSEEK_MAX_CHARS: ${DEEPSEEK_MAX_CHARS:-60000}
      PUBLICATION_EXTRACT_ENABLED: ${PUBLICATION_EXTRACT_ENABLED:-true}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_TIMEOUT_SECONDS: ${SILICONFLOW_TIMEOUT_SECONDS:-60}
      SILICONFLOW_RETRIES: ${SILICONFLOW_RETRIES:-3}
      SILICONFLOW_EMBEDDING_BATCH_SIZE: ${SILICONFLOW_EMBEDDING_BATCH_SIZE:-0}
      SILICONFLOW_EMBEDDING_CONCURRENCY: ${SILICONFLOW_EMBEDDING_CONCURRENCY:-120}
      SILICONFLOW_REQUESTS_PER_SECOND: ${SILICONFLOW_REQUESTS_PER_SECOND:-30}
      SILICONFLOW_TOKENS_PER_MINUTE: ${SILICONFLOW_TOKENS_PER_MINUTE:-1000000}
      SILICONFLOW_MAX_REQUEST_TOKENS: ${SILICONFLOW_MAX_REQUEST_TOKENS:-30000}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-512}
      VECTOR_INDEX_ENABLED: ${VECTOR_INDEX_ENABLED:-true}
      VECTOR_SEARCH_CANDIDATES: ${VECTOR_SEARCH_CANDIDATES:-5000}
      VECTOR_JOB_CONCURRENCY: ${VECTOR_JOB_CONCURRENCY:-12}
    volumes:
      - type: bind
        source: ./data
        target: /library
      - type: bind
        source: ./.docsearch
        target: /data

  frontend:
    build:
      context: ./frontend
    container_name: local-doc-search-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8517:80"
